services:

  frontend:
    build:
      context: ./Books_UI/books-react-ui

    ports:
      - "5173:5173"

    depends_on:
      - backend

    environment:
      - VITE_API_URL=http://localhost:8080/api

    command: npm run dev -- --host

  backend:
    build:
      context: ./BooksApi

    ports:
      - "8080:8080"

    depends_on:
      - sqlserver

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=mydb;User=sa;Password=YourPassword123!;TrustServerCertificate=True
      - Jwt__Key=ThisIsMySuperSecretJwtKey1234567890
      - Jwt__Issuer=BooksApi
      - Jwt__Audience=BooksApiUsers

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: sqlserver

    environment:
      SA_PASSWORD: "YourPassword123!"
      ACCEPT_EULA: "Y"

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

volumes:
  sql_data: